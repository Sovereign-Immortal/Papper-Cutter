[workspace]
resolver = "2"
members = [
    "crates/papper-cutter-domain",
    "crates/papper-cutter-mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Papper Cutter Team"]

[workspace.dependencies]
papper-cutter-domain = { path = "crates/papper-cutter-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.6" }
